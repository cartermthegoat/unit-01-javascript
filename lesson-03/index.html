 <script>
 let score = 10;              // 1
 // 10
score += 5;                  // 2
// 15
score *= 2;                  // 3
// 30
let bonus = score % 7;       // 4
// 2
score -= bonus;              // 5
// 28
let old = score++;           // 6
// 28
let next = ++score;          // 7
// 29
score /= 3;                  // 8
// 10
bonus--;                     // 9
// 1
score = score + bonus * 4;  // 10
// 14

// 1. Why is old 28 but score 29 after line 6?
// A: Because the score on old is a post fix so the old will just equal 28 but on line 6 it is a prefix so it will equal 29
// 2. Why doesn’t line 10 give 44?
// A:  Because score is equal to 10 on line 8 and bonus is equal to 1 on line 9 so the end result will be 14
// 3. What would score be if line 3 came before line 2?
// A:  If line 3 came before line 2 it would be 19.6666666666668
console.log(score, bonus, old, next) 
 </script>
