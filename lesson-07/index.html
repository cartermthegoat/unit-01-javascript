 <script>
let grade = Number(prompt("Enter your test score:"));
    if (grade >= 90) {
alert("A");
    } else if (grade >= 80 && grade <= 89) {
    alert("B")  
} else if 
 (grade >= 70 && grade <= 79) {
 alert("C")
} else if 
 (grade >= 60 && grade <= 69) {
 alert("D")
} else {
(grade < 60)
alert("F")
}

  89         | B        | B
  60         | D        | D
  59         | F        | F
  100        | A        | A

 </script>
