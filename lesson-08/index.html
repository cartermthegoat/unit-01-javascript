<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
 <script>
let day = (prompt("Enter a day number from 1-7"))
    switch (day) {
    case "1": 
    alert("Monday: Soccer practice");
    break;
    case "2": 
    alert("Tuesday: Weight Room");
    break;
    case "3":
    alert("Wednesday: Work")
    break;
    case "4":
    alert("Thursday: Badmitton Practice")
    break;
    case "5":
    alert("Friday: Basketball Practice")
    break;
    case "6": 
    alert("Saturday: Open Runs ")
    break;
    case "7":
    alert("Sunday: Church")
    break;
    default:
    alert("Invalid day")
    break;
    }
 </script>   
</body>
</html>
